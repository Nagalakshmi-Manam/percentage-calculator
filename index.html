<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Percentage Calculator</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #cce5ff, #e6f7ff);
    }

    .container {
      background: #fff;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0px 4px 20px rgba(0,0,0,0.1);
      width: 90%;
      max-width: 400px;
      text-align: center;
    }

    h2 {
      margin-bottom: 20px;
      color: #333;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #4da6ff;
      color: #fff;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background: #3399ff;
    }

    .result {
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
      color: #333;
    }

    @media (max-width: 480px) {
      .container {
        padding: 20px;
      }
      h2 {
        font-size: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Percentage Calculator</h2>
    <input type="number" id="amount" placeholder="Enter amount">
    <input type="number" id="percentage" placeholder="Enter percentage (%)">
    <button onclick="calculatePercentage()">Calculate</button>
    <div class="result" id="result"></div>
  </div>

  <script>
    function calculatePercentage() {
      const amount = parseFloat(document.getElementById('amount').value);
      const percentage = parseFloat(document.getElementById('percentage').value);
      const resultElement = document.getElementById('result');

      if (isNaN(amount) || isNaN(percentage)) {
        resultElement.textContent = "⚠️ Please enter valid numbers.";
        return;
      }

      const result = (amount * percentage) / 100;
      resultElement.textContent = `${percentage}% of ${amount} = ${result}`;
    }
  </script>
</body>
</html>
